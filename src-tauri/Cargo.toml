[package]
name = "bson-editor"
description = "A fast JSON/BSON reader and editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name unique so it cannot collide with the bin
# name, which otherwise breaks Windows builds.
name = "bson_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
doccore = { workspace = true }
